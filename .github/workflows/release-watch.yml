# Polls Debt-Relief-Tracker/Tracker for GitHub releases and recent commits to main, and pushes an
# update to src/data/tracker-activity.json (in this repo) when either changes. /changelog reads that
# file at build time (see src/lib/github.ts), so the site build makes no GitHub API calls of its
# own — unauthenticated calls from Cloudflare's shared build IPs hit GitHub's per-IP rate limit and
# failed deploys. The workflow's GITHUB_TOKEN is authenticated, so it isn't affected.
#
# This lives in THIS repo (not the Tracker repo) by design, so it's a poll rather than a true
# webhook — updates land within one poll interval, not instantly. See docs/blog-plan.md's sibling
# note in the plan file for the trade-off discussion.
#
# Why a committed data file instead of GitHub Actions repo variables: the default GITHUB_TOKEN
# has no grantable permission scope for managing Actions variables/secrets via API (confirmed via
# a live 403 "Resource not accessible by integration" from `gh variable set`) — only a personal
# access token can do that. `contents: write` (which GITHUB_TOKEN *can* be granted) is enough to
# commit a data file instead, and as a bonus, that push to main is itself picked up by
# Cloudflare Workers Builds' normal git-triggered auto-deploy — no separate Deploy Hook/secret
# needed to trigger a rebuild.
name: Watch Tracker activity

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Runs are 15 minutes apart and typically finish in seconds, but this guards against a slow run
# overlapping the next poll and racing on the state-file push.
concurrency:
  group: tracker-watch
  cancel-in-progress: false

permissions:
  contents: write # to commit/push the state file

env:
  GH_TOKEN: ${{ github.token }}
  TRACKER_REPO: Debt-Relief-Tracker/Tracker
  DATA_FILE: src/data/tracker-activity.json

jobs:
  check-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Tracker releases and commits
        run: |
          gh api "repos/${TRACKER_REPO}/releases" --jq '
            [.[] | select(.draft | not) | {
              tag: .tag_name,
              name: (.name // .tag_name),
              publishedAt: .published_at,
              body: (.body // ""),
              url: .html_url
            }]' > releases.json
          gh api "repos/${TRACKER_REPO}/commits?sha=main&per_page=15" --jq '
            [.[] | {
              sha: .sha,
              summary: (.commit.message | split("\n")[0]),
              authorName: (.commit.author.name // "Unknown"),
              date: .commit.author.date,
              url: .html_url
            }]' > commits.json
          jq -n --slurpfile r releases.json --slurpfile c commits.json \
            '{releases: $r[0], commits: $c[0]}' > new-activity.json

      - name: Record new data and push
        run: |
          if [ -f "$DATA_FILE" ] && cmp -s new-activity.json "$DATA_FILE"; then
            echo "No change."
            exit 0
          fi
          mv new-activity.json "$DATA_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DATA_FILE"
          git commit -m "chore: update Tracker activity data"
          git push
