# Polls Debt-Relief-Tracker/Tracker for new GitHub releases and new commits to main, and pushes an
# update to .github/tracker-watch-state.json (in this repo) when either changes, so /changelog
# (built from release *and* recent-commit data at build time, see src/lib/github.ts) stays current.
#
# This lives in THIS repo (not the Tracker repo) by design, so it's a poll rather than a true
# webhook — updates land within one poll interval, not instantly. See docs/blog-plan.md's sibling
# note in the plan file for the trade-off discussion.
#
# Why a committed state file instead of GitHub Actions repo variables: the default GITHUB_TOKEN
# has no grantable permission scope for managing Actions variables/secrets via API (confirmed via
# a live 403 "Resource not accessible by integration" from `gh variable set`) — only a personal
# access token can do that. `contents: write` (which GITHUB_TOKEN *can* be granted) is enough to
# commit a small state file instead, and as a bonus, that push to main is itself picked up by
# Cloudflare Workers Builds' normal git-triggered auto-deploy — no separate Deploy Hook/secret
# needed to trigger a rebuild.
name: Watch Tracker activity

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Runs are 15 minutes apart and typically finish in seconds, but this guards against a slow run
# overlapping the next poll and racing on the state-file push.
concurrency:
  group: tracker-watch
  cancel-in-progress: false

permissions:
  contents: write # to commit/push the state file

env:
  GH_TOKEN: ${{ github.token }}
  TRACKER_REPO: Debt-Relief-Tracker/Tracker
  STATE_FILE: .github/tracker-watch-state.json

jobs:
  check-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch latest Tracker release
        id: latest_release
        run: |
          # Tracker may not have cut a release yet — /releases/latest 404s in that case, which
          # isn't an error, just "nothing to compare against yet".
          if tag=$(gh api "repos/${TRACKER_REPO}/releases/latest" --jq .tag_name 2>/dev/null); then
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch latest Tracker commit
        id: latest_commit
        run: |
          sha=$(gh api "repos/${TRACKER_REPO}/commits/main" --jq .sha)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Read last-seen state
        id: previous
        run: |
          echo "tag=$(jq -r '.releaseTag // empty' "$STATE_FILE")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r '.commitSha // empty' "$STATE_FILE")" >> "$GITHUB_OUTPUT"

      - name: Record new state and push
        if: >
          steps.latest_release.outputs.tag != steps.previous.outputs.tag ||
          steps.latest_commit.outputs.sha != steps.previous.outputs.sha
        env:
          RELEASE_TAG: ${{ steps.latest_release.outputs.tag }}
          COMMIT_SHA: ${{ steps.latest_commit.outputs.sha }}
        run: |
          jq -n --arg tag "$RELEASE_TAG" --arg sha "$COMMIT_SHA" \
            '{releaseTag: (if $tag == "" then null else $tag end), commitSha: $sha}' \
            > "$STATE_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE_FILE"
          git commit -m "chore: record Tracker activity (release=${RELEASE_TAG:-none}, commit=${COMMIT_SHA})"
          git push
